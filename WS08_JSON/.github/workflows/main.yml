name: Hae avain githubista
on: [push] # Suorita aina kun koodia pushataan
jobs:
  testaus:
    runs-on: ubuntu-latest
    # TÄHÄN LISÄTÄÄN MÄÄRITYS:
    env:
      OWAPI: ${{ secrets.OWAPI }} # Lataa avain secretsistä
    steps:
    - name: Checkout koodi
      uses: actions/checkout@v4
    - name: Asenna riippuvuudet
      run: npm install
    - name: Aja testit avaimella
      # Testikomentosi pääsee nyt käsiksi avaimeen process.env.MY_API_KEY kautta
      run: npm run test